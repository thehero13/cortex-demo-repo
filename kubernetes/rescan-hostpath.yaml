apiVersion: v1
kind: Pod
metadata:
  name: rescan-hostpath
spec:
  hostNetwork: true
  containers:
    - name: app
      image: busybox:latest
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
      volumeMounts:
        - name: root
          mountPath: /host
  volumes:
    - name: root
      hostPath:
        path: /
